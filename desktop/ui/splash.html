<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Nexus PDV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #14293b 0%, #0b1622 70%, #060d16 100%);
    color: #e7e9ee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag; /* pode arrastar a janela clicando em qualquer lugar */
  }
  .wrap { text-align: center; animation: fadeIn 0.4s ease both; }
  .logo {
    width: 180px; height: 180px; margin: 0 auto 22px;
    filter: drop-shadow(0 8px 30px rgba(232, 198, 74, 0.25));
    animation: pulse 2.8s ease-in-out infinite;
  }
  h1 {
    font-size: 32px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #4CAF6D 0%, #E8C64A 50%, #4CAF6D 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .brand { font-size: 13px; color: #9aa3b0; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
  .sub { font-size: 15px; color: #cfd4dd; font-weight: 400; margin-bottom: 34px; }
  .bar { width: 260px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin: 0 auto; }
  .bar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, transparent, #E8C64A 30%, #4CAF6D 70%, transparent);
    border-radius: 4px;
    animation: slide 1.4s ease-in-out infinite;
  }
  .status { margin-top: 14px; font-size: 12px; color: #7c8697; letter-spacing: 0.06em; }
  .versao { position: fixed; bottom: 12px; right: 14px; font-size: 10px; color: #556072; letter-spacing: 0.06em; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @keyframes slide { 0% { transform: translateX(-140%); } 100% { transform: translateX(340%); } }
</style>
</head>
<body>
<div class="wrap">
  <img src="logo-512.png" alt="Nexus" class="logo" />
  <div class="brand">Nexus • PDV</div>
  <h1>Bem-vindo</h1>
  <div class="sub">Iniciando seu sistema…</div>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Carregando</div>
</div>
<div class="versao" id="v"></div>
<script>
  const msgs = ["Verificando licença", "Preparando o banco de dados", "Subindo o servidor local", "Quase lá"];
  let i = 0;
  const el = document.getElementById("status");
  setInterval(() => { i = (i + 1) % msgs.length; el.textContent = msgs[i] + "…"; }, 1400);
  // versão vinda do preload (se disponível)
  if (window.splash && window.splash.versao) {
    window.splash.versao().then(v => document.getElementById("v").textContent = "v" + v);
  }
</script>
</body>
</html>
